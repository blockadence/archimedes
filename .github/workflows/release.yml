# Cutting a release is the whole of publishing this tool, both ways it is
# installed: `gh extension install` downloads a binary from the release this
# builds, and it is the release tag that `--version` reports back. Tag and
# push and there is nothing else to do.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A tag with a `-` in it (v0.2.0-rc.1) publishes as a prerelease, which
# `gh extension install` will not hand to anyone -- the safe way to check
# this workflow end to end. It checks everything except the install: a
# prerelease is not installable by any route, `--pin` included, because gh
# decides "is this a binary extension" from `releases/latest`. docs/cli.md,
# "Cutting a release", has the way round it and what that costs.
#
# The run also attests to what it built, so that "is this the binary the
# repository produced?" is answerable by whoever downloaded it. README's
# install section carries the command; the reasoning is on the inputs below.
name: release

on:
  push:
    tags:
      - "v*"

# Read-only for the file, so that every grant below is something one job
# asked for rather than something every job inherited. This workflow needs
# no secret of its own at all -- neither the publish nor the attestation
# uses anything but the token GitHub mints for the run.
permissions:
  contents: read

jobs:
  # The gate. This is release.yml's only defense against publishing twelve
  # binaries nothing ran a test on, and it is deliberately the same job a
  # push runs rather than a copy of it: one definition, so there is no
  # second recipe to drift.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    # What a compromise of this workflow would cost, in one place and named.
    # `contents` creates the release and uploads the assets. The other two
    # are the whole of what signing costs: `id-token` mints the short-lived
    # OIDC token that stands in for a signing key, and `attestations`
    # records the result against the repository. All three belong to this
    # job and not to the file -- at the top they would also be handed to the
    # gate, which runs the suite and an `npm install -g` with them.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # The one action here we do not control, and the one the Node 20
      # deprecation did not touch: it is composite, so there is no Node
      # runtime under it to deprecate. Left on v2 deliberately -- a bump
      # would mean re-reading its changelog for what it does with the two
      # inputs below. docs/cli.md, "The Node the actions run on", has why.
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          # See the script for why this build isn't the action's own.
          build_script_override: .github/release-build.sh
          # Runs actions/attest-build-provenance over dist/, binding each
          # published asset to the workflow, repository and commit that
          # produced it. Someone holding only the download and the
          # repository name can check that binding with
          # `gh attestation verify`.
          generate_attestations: true
          # Published as a draft, and promoted by the step below only after
          # the attestations it just asked for have been verified. That is
          # a decision, and it is the one worth naming here.
          #
          # The alternative was to publish outright and let a failed check
          # turn the run red. It is cheaper -- one step, nothing to promote
          # -- and it reports on a release that already exists: the assets
          # stay downloadable, `gh extension install` keeps handing them
          # out, and the red run is a note beside a thing people are
          # already installing. The whole point of the attestation is that
          # an operator can tell a tampered asset from a genuine one, and
          # an asset with no attestation at all is exactly what they cannot
          # tell apart from a tampered one. Shipping that and going red is
          # better than silence and still not good.
          #
          # A draft is not installable -- `gh extension install` reads
          # `releases/latest`, and that endpoint does not return drafts --
          # so nothing unverified is ever reachable. What it costs is this:
          # a second step that has to do the promoting, one more place the
          # publish can half-finish, and a failed run that leaves a draft
          # nobody promoted. Recovering from that one is a plain re-run --
          # the action looks for an existing release before it creates one,
          # and gh finds a draft by tag, so the re-run uploads into the same
          # draft with --clobber rather than making a second.
          # `.github/release-verify.sh` carries the detail.
          draft_release: true
          # No `gpg_fingerprint:`, and that is a decision rather than an
          # omission. The action accepts one and passes it to its release
          # script, but a GPG signature needs a long-lived private key, and
          # the place it would live is a repository secret -- exactly the
          # credential whose theft would let someone sign a malicious build,
          # standing here forever for a tool this size. The attestation
          # above answers the same question with an identity minted per run
          # and never stored, so what a leak of this repository's secrets
          # could do is unchanged by any of this.
          #
          # What that trades away: verification is gh-shaped and
          # GitHub-shaped. It needs `gh attestation verify` rather than any
          # tool that predates it, the evidence lives in GitHub's
          # transparency log rather than in a file beside the asset, and it
          # would not survive this repository moving off GitHub. If that
          # last one ever happens, this is the input to revisit.

      # The step that turns "we asked for attestations" into "this release
      # has them". It runs the same `gh attestation verify` README tells an
      # operator to run, against the assets still on disk, and promotes the
      # draft only if every one of them passes -- so it fails for the same
      # reasons an operator's would rather than by inspecting our own side
      # of it. The reasoning, the recovery procedure for a failed run, and
      # what this leans on outside this repository are all in the script.
      #
      # No `continue-on-error`, and nothing here may grow one: a check that
      # cannot fail leaves the silence it was added to end, wearing the
      # check's name. tests/release_verifies_attestations.sh drives the
      # script through every failure it is supposed to have.
      - name: Verify the attestations, then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the `run:`
          # line. A tag name is chosen by whoever pushes it, and `${{ }}` is
          # substituted into the script before bash sees it -- so a tag
          # named `v1$(...)` would run inside a job holding contents,
          # id-token and attestations write. Quoting does not help: command
          # substitution expands inside double quotes.
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: .github/release-verify.sh dist "$RELEASE_REPO" "$RELEASE_TAG"
